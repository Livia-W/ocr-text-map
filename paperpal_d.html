<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纸伴 PaperPal · D 模块（朗读与阅读管理）自测台</title>
  <style>
    :root {
      --bg: #0f1714;
      --card: #16221d;
      --border: rgba(255, 255, 255, 0.12);
      --mint: #88f0bd;
      --amber: #ffc65c;
      --text: #f3f7f4;
      --muted: #9aa8a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }
    .wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 20px; color: var(--mint); }
    h2 { margin: 0 0 12px; font-size: 15px; color: #dce6e0; }
    .sub { color: var(--muted); font-size: 13px; margin: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    button.primary {
      background: var(--mint);
      color: #091d14;
      font-weight: 700;
      border-color: var(--mint);
    }
    button.active {
      border-color: var(--amber);
      color: var(--amber);
    }
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .status-bar strong { color: var(--amber); }
    .lines { display: grid; gap: 6px; }
    .line-item {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .line-item:hover { background: rgba(255, 255, 255, 0.07); }
    .line-item.active {
      background: rgba(255, 198, 92, 0.16);
      border-color: var(--amber);
      color: #fff5dc;
    }
    .line-no { font-size: 12px; color: var(--muted); min-width: 48px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
    ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; color: #cfd9d3; }
    .empty { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>纸伴 · D 模块（朗读与阅读管理）自测台</h1>
      <p class="sub">已内置 B 队友 OCR 文字地图《“心”鲜的世界》，点击任意按钮或文字行即可测试真实语音朗读。</p>
      <div class="controls">
        <button class="primary" id="btnPlay">开始 / 继续朗读</button>
        <button id="btnPause">暂停</button>
        <button id="btnPrev">上一行</button>
        <button id="btnNext">下一行</button>
        <button id="btnSave">保存当前选区 (Highlight)</button>
        <button id="btnMockSelect">模拟 C 框选保存两行</button>
        <button id="btnLoadJson">导入 B 的文字地图 JSON</button>
        <input type="file" id="fileInput" accept=".json" hidden />
      </div>
      <p id="importStatus" class="sub" role="status" aria-live="polite"></p>
      <div class="controls">
        <span style="font-size:13px;color:var(--muted);align-self:center;">语速：</span>
        <button class="speed-btn" data-speed="0.75">0.75x</button>
        <button class="speed-btn active" data-speed="1">1.0x</button>
        <button class="speed-btn" data-speed="1.25">1.25x</button>
        <button class="speed-btn" data-speed="1.5">1.5x</button>
        <button class="speed-btn" data-speed="2">2.0x</button>
      </div>
    </div>

    <div class="card">
      <div class="status-bar">
        <span>状态：<strong id="stStatus">idle</strong></span>
        <span>页面：<strong id="stPage">—</strong></span>
        <span>进度：<strong id="stProgress">0 / 0</strong></span>
        <span>语速：<strong id="stSpeed">1.0x</strong></span>
      </div>
      <div id="lineList" class="lines"></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>我的标记（Highlight 笔记）</h2>
        <ul id="hlList"><li class="empty">暂无保存的选区</li></ul>
      </div>
      <div class="card">
        <h2>阅读历史记录</h2>
        <ul id="hisList"><li class="empty">暂无历史记录</li></ul>
      </div>
    </div>
  </div>

  <script>window.FEELYREADER_NO_AUTO_TTS = true;</script>
  <script src="reading_manager.js"></script>
  <script>
    "use strict";
    const manager = new ReadingManager({ autoListenA: false });
    const lineList = document.getElementById("lineList");
    const hlList = document.getElementById("hlList");
    const hisList = document.getElementById("hisList");
    const importStatus = document.getElementById("importStatus");

    function renderList(container, rows, emptyText, format) {
      container.replaceChildren();
      if (!rows.length) {
        const item = document.createElement("li");
        item.className = "empty";
        item.textContent = emptyText;
        container.append(item);
        return;
      }
      for (const row of rows) {
        const item = document.createElement("li");
        item.textContent = format(row);
        container.append(item);
      }
    }

    const unsubscribe = manager.onStateChange((state) => {
      document.getElementById("stStatus").textContent = state.status;
      document.getElementById("stPage").textContent = state.pageLabel;
      document.getElementById("stProgress").textContent = `${state.totalLines ? state.currentIndex + 1 : 0} / ${state.totalLines}`;
      document.getElementById("stSpeed").textContent = `${state.speed}x`;
      if (state.lastError) importStatus.textContent = state.lastError;
      lineList.replaceChildren();
      manager.lines.forEach((line, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "line-item" + (index === state.currentIndex ? " active" : "");
        item.setAttribute("aria-pressed", String(index === state.currentIndex));
        const number = document.createElement("span");
        number.className = "line-no";
        number.textContent = `第 ${index + 1} 行`;
        const text = document.createElement("span");
        text.textContent = line.text;
        item.append(number, text);
        item.onclick = () => manager.play(index);
        lineList.append(item);
      });
      renderList(hlList, manager.getHighlights(), "暂无保存的选区", (item) => `[${item.pageLabel || "当前书页"}] ${item.text}`);
      renderList(hisList, manager.getHistory().slice(0, 10), "暂无历史记录", (item) => `[${item.time || ""}] ${item.action || ""}：${item.detail || ""}`);
      document.querySelectorAll(".speed-btn").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.speed) === state.speed);
      });
    });

    document.getElementById("btnPlay").onclick = () => manager.resume();
    document.getElementById("btnPause").onclick = () => manager.pause();
    document.getElementById("btnPrev").onclick = () => manager.prevLine();
    document.getElementById("btnNext").onclick = () => manager.nextLine();
    document.getElementById("btnSave").onclick = () => manager.saveHighlight();
    document.getElementById("btnMockSelect").onclick = () => {
      const slice = manager.lines.slice(manager.currentIndex, manager.currentIndex + 2);
      manager.onSelectRegion(slice.map((line) => line.text).join(" "), slice.map((line) => line.id));
    };
    document.querySelectorAll(".speed-btn").forEach((button) => {
      button.onclick = () => manager.setSpeed(Number(button.dataset.speed));
    });
    const fileInput = document.getElementById("fileInput");
    document.getElementById("btnLoadJson").onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const file = fileInput.files?.[0];
      fileInput.value = "";
      if (!file) return;
      try {
        const json = JSON.parse(await file.text());
        if (!manager.loadOcrMap(json)) throw new Error("JSON 需要包含文字地图的 lines 数组。");
        importStatus.textContent = `已载入 ${manager.currentPageLabel}，共 ${manager.lines.length} 行。`;
      } catch (error) {
        importStatus.textContent = `导入失败：${error.message}`;
      }
    };
    window.addEventListener("pagehide", (event) => {
      if (event.persisted) manager.pause(true);
      else { unsubscribe(); manager.destroy(); }
    });
  </script>
</body>
</html>
